<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Inflection social card source</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--body);
      }
      main {
        position: relative;
        height: 100%;
        padding: 58px 64px;
      }
      .brand {
        font: 400 32px var(--serif);
        letter-spacing: -0.7px;
      }
      h1 {
        position: relative;
        z-index: 1;
        margin: 95px 0 28px;
        font-family: var(--serif);
        font-weight: 400;
        font-size: 76px;
        letter-spacing: -2.8px;
        line-height: 1.14;
      }
      h1 span {
        color: var(--accent);
      }
      p {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.35px;
        color: var(--muted);
      }
      .address {
        position: absolute;
        bottom: 53px;
        left: 65px;
        font-size: 18px;
        color: var(--muted);
        letter-spacing: 0.15px;
      }
      .curves {
        position: absolute;
        width: 355px;
        height: 340px;
        right: 39px;
        top: 174px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">inflection</div>
      <h1>small edits.<br /><span>different answers.</span></h1>
      <p>explore how wording changes ai probabilities</p>
      <svg class="curves" viewBox="0 0 355 340" aria-hidden="true">
        <path
          d="M35 273H320M35 170H320M35 63H320"
          fill="none"
          stroke="var(--line)"
          stroke-width="1.5"
        />
        <path
          d="M100 36V302M206 36V302M313 36V302"
          fill="none"
          stroke="var(--line)"
          stroke-width="1.5"
          stroke-dasharray="3 7"
        />
        <path
          d="M35 273C189 273 147 63 313 63"
          fill="none"
          stroke="var(--accent)"
          stroke-width="7"
          stroke-linecap="round"
        />
        <path
          d="M35 170C175 170 200 273 313 273"
          fill="none"
          stroke="var(--gold)"
          stroke-width="7"
          stroke-linecap="round"
        />
        <circle
          cx="35"
          cy="273"
          r="10"
          fill="var(--paper)"
          stroke="var(--accent)"
          stroke-width="4"
        />
        <circle
          cx="35"
          cy="170"
          r="10"
          fill="var(--paper)"
          stroke="var(--gold)"
          stroke-width="4"
        />
        <circle cx="313" cy="63" r="12" fill="var(--accent)" />
        <circle cx="313" cy="273" r="12" fill="var(--gold)" />
      </svg>
      <div class="address">bensonperry.com/inflection</div>
    </main>
  </body>
</html>
